spring:
  application:
    name: wenji-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wenji?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${DB_INIT_MODE:never}
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wenji:
  upload-dir: ${UPLOAD_DIR:../uploads}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-production}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
