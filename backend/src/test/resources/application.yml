spring:
  datasource:
    url: jdbc:h2:mem:wenji;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
      data-locations: classpath:test-data.sql
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto

wenji:
  upload-dir: ${java.io.tmpdir}/wenji-test-uploads
  jwt:
    secret: test-secret-must-be-at-least-thirty-two-characters
    expiration-seconds: 7200
